nodes:
  - id: ui
    build: pip install -e nodes/dora-openarm-data-collection-ui
    path: dora-openarm-data-collection-ui
    env:
      METADATA_FILE: "metadata_mujoco.yaml"
    inputs:
      tick: dora/timer/secs/1
      button_a:
        source: udp-receiver/button_a
        queue_size: 100
      button_b:
        source: udp-receiver/button_b
        queue_size: 100
    outputs:
      - command

  - id: quittable-tick-leader
    build: pip install -e nodes/dora-openarm-quitter
    path: dora-openarm-quitter
    inputs:
      command: ui/command
      tick: dora/timer/millis/2
    outputs:
      - tick

  - id: udp-receiver
    build: pip install -e nodes/dora-openarm-vr
    path: dora-openarm-quest-receiver
    args: "--host 0.0.0.0 --port 5006"
    inputs:
      tick: quittable-tick-leader/tick
    outputs:
      - pose_right
      - trigger_right
      - pose_left
      - pose_reference
      - trigger_left
      - joystick_y
      - button_a
      - button_b
      - button_x
      - status

  - id: ik
    build: pip install -e nodes/dora-openarm-kinematics
    path: dora-openarm-ik
    args: "--mode bimanual --max-iters 10 --dt 0.1 --damping 0.1 --posture-cost 0.01 --lm-damping 0.01"
    inputs:
      tick: quittable-tick-leader/tick
      target_right: udp-receiver/pose_right
      target_left: udp-receiver/pose_left
      trigger_right: udp-receiver/trigger_right
      trigger_left: udp-receiver/trigger_left
    outputs:
      - position_left
      - position_right
      - status

  - id: ros2-bridge
    path: ./nodes/dora-openarm-ros2-bridge/run_bridge.sh
    env:
      ROS_DOMAIN_ID: "1"
      EEF_FRAME_ID: "base_link"
      EEF_RATE_HZ: "100"
      GRIPPER_MODE: "v1_prismatic"
      # Measure with `python3 isaac/check_frames.py --scene demo` and set the
      # printed z here; 0.698 is an inference, not a measurement.
      ARM_ORIGIN_TO_BASE_Z: "0.698"
      # Isaac Lab reads this UDP socket; set the port to 0 to disable.
      ISAAC_UDP_HOST: "127.0.0.1"
      ISAAC_UDP_PORT: "5007"
    # queue_size: 1 -- udp-receiver ticks at 500 Hz and repeats the last UDP
    # packet, so without this the bridge builds a backlog and the rate limiter
    # ends up throttling stale data.
    inputs:
      position_left:
        source: ik/position_left
        queue_size: 1
      position_right:
        source: ik/position_right
        queue_size: 1
      pose_right:
        source: udp-receiver/pose_right
        queue_size: 1
      pose_left:
        source: udp-receiver/pose_left
        queue_size: 1
      pose_reference:
        source: udp-receiver/pose_reference
        queue_size: 1
